version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: procurement_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2003
      POSTGRES_DB: procurementdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: procurement_app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://postgres:2003@db:5432/procurementdb"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs

volumes:
  postgres_data:
